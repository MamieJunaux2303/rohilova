<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1225" width="1000" height="1225"><rect width="1000" height="1225" fill="#FFFFFF"/><text x="60" y="66" font-family="'Trebuchet MS', 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#1F2A33" font-weight="bold" font-style="normal" text-anchor="start"><tspan x="60" dy="0.0">Exemple de séquence : la saponification</tspan></text><text x="60" y="104" font-family="'Trebuchet MS', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#5B6770" font-weight="normal" font-style="normal" text-anchor="start"><tspan x="60" dy="0.0">Les sept moments appliqués à une notion de première L et OSE</tspan></text><path d="M110,200 V1070" stroke="#D5DBE0" stroke-width="6"/><circle cx="110" cy="204" r="34" fill="#A8432A"/><g transform="translate(87.0,181.1) scale(0.4590)" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 50 L50 24 L80 50"/><path d="M29 44 V78 H71 V44"/><path d="M45 78 V60 H55 V78"/><circle cx="76" cy="22" r="7"/></g><text x="170" y="196" font-family="'Trebuchet MS', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#A8432A" font-weight="bold" font-style="normal" text-anchor="start"><tspan x="170" dy="0.0">M1  Situation de départ</tspan></text><text x="170" y="226" font-family="'Trebuchet MS', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1F2A33" font-weight="normal" font-style="normal" text-anchor="start"><tspan x="170" dy="0.0">Le prix du savon flambe, et chacun utilise un savon différent</tspan><tspan x="170" dy="24.6">pour la lessive. L&#x27;enseignant montre un savon industriel et un</tspan><tspan x="170" dy="24.6">savon local (savony nosy).</tspan></text><circle cx="110" cy="349" r="34" fill="#B7811C"/><g transform="translate(87.0,326.1) scale(0.4590)" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="18" width="46" height="32" rx="10"/><path d="M24 50 L20 62 L36 50"/><rect x="42" y="40" width="46" height="30" rx="10" fill="#B7811C"/><path d="M74 70 L80 82 L64 70" fill="#B7811C"/></g><text x="170" y="341" font-family="'Trebuchet MS', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#B7811C" font-weight="bold" font-style="normal" text-anchor="start"><tspan x="170" dy="0.0">M2  Conceptions des élèves</tspan></text><text x="170" y="371" font-family="'Trebuchet MS', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1F2A33" font-weight="normal" font-style="normal" text-anchor="start"><tspan x="170" dy="0.0">Pourquoi certains savons moussent-ils et d&#x27;autres non ? Avec</tspan><tspan x="170" dy="24.6">quoi fabrique-t-on le savon ? Les réponses sont notées au</tspan><tspan x="170" dy="24.6">tableau, par exemple « plus ça mousse, mieux ça lave ».</tspan></text><circle cx="110" cy="494" r="34" fill="#7A3E7A"/><g transform="translate(87.0,471.1) scale(0.4590)" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M34 36 C34 22 46 16 54 17 C64 18 70 26 69 35 C68 45 56 48 52 56 L52 64"/><circle cx="52" cy="80" r="3.5" fill="#FFFFFF"/></g><text x="170" y="486" font-family="'Trebuchet MS', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#7A3E7A" font-weight="bold" font-style="normal" text-anchor="start"><tspan x="170" dy="0.0">M3  Problématisation</tspan></text><text x="170" y="516" font-family="'Trebuchet MS', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1F2A33" font-weight="normal" font-style="normal" text-anchor="start"><tspan x="170" dy="0.0">Question-problème écrite au tableau : comment transforme-t-on</tspan><tspan x="170" dy="24.6">une graisse en savon, et la mousse indique-t-elle vraiment</tspan><tspan x="170" dy="24.6">qu&#x27;un savon lave bien ?</tspan></text><circle cx="110" cy="639" r="34" fill="#2E4A8C"/><g transform="translate(87.0,616.0) scale(0.4590)" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="14" width="42" height="56" rx="5"/><path d="M25 28 H48 M25 38 H48 M25 48 H38"/><circle cx="60" cy="60" r="15" fill="#2E4A8C"/><path d="M71 71 L84 84"/></g><text x="170" y="631" font-family="'Trebuchet MS', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2E4A8C" font-weight="bold" font-style="normal" text-anchor="start"><tspan x="170" dy="0.0">M4  Construction du savoir</tspan></text><text x="170" y="661" font-family="'Trebuchet MS', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1F2A33" font-weight="normal" font-style="normal" text-anchor="start"><tspan x="170" dy="0.0">Par groupes, les élèves décodent des étiquettes (sodium</tspan><tspan x="170" dy="24.6">palmate, sodium tallowate) et un document sur l&#x27;eau dure, puis</tspan><tspan x="170" dy="24.6">les comparent aux réponses du tableau.</tspan></text><circle cx="110" cy="784" r="34" fill="#3D4F61"/><g transform="translate(87.0,761.0) scale(0.4590)" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="14" width="46" height="66" rx="5"/><path d="M30 30 H56 M30 42 H56 M30 54 H46"/><path d="M58 76 L82 46" stroke-width="8"/><path d="M58 76 L55 84 L62 80" fill="#FFFFFF"/></g><text x="170" y="776" font-family="'Trebuchet MS', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#3D4F61" font-weight="bold" font-style="normal" text-anchor="start"><tspan x="170" dy="0.0">M5  Trace écrite</tspan></text><text x="170" y="806" font-family="'Trebuchet MS', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1F2A33" font-weight="normal" font-style="normal" text-anchor="start"><tspan x="170" dy="0.0">Définition de la saponification, équation-bilan (corps gras +</tspan><tspan x="170" dy="24.6">soude → glycérol + savon), effet des ions calcium et magnésium</tspan><tspan x="170" dy="24.6">sur la mousse.</tspan></text><circle cx="110" cy="929" r="34" fill="#3F7D3A"/><g transform="translate(87.0,906.0) scale(0.4590)" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 76 C22 44 44 22 80 20 C80 54 60 78 26 76 Z"/><path d="M26 74 C40 60 52 48 66 36"/></g><text x="170" y="921" font-family="'Trebuchet MS', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#3F7D3A" font-weight="bold" font-style="normal" text-anchor="start"><tspan x="170" dy="0.0">M6  Retour et durabilité</tspan></text><text x="170" y="951" font-family="'Trebuchet MS', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1F2A33" font-weight="normal" font-style="normal" text-anchor="start"><tspan x="170" dy="0.0">Pourquoi le prix du savon augmente-t-il ? Que change la</tspan><tspan x="170" dy="24.6">fabrication locale pour l&#x27;économie, la société et</tspan><tspan x="170" dy="24.6">l&#x27;environnement, par exemple les rejets dans les rivières ?</tspan></text><circle cx="110" cy="1074" r="34" fill="#1F7A80"/><g transform="translate(87.0,1051.0) scale(0.4590)" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="14" width="56" height="70" rx="6"/><path d="M30 34 L36 40 L46 28"/><path d="M54 35 H66"/><path d="M30 60 L36 66 L46 54"/><path d="M54 61 H66"/></g><text x="170" y="1066" font-family="'Trebuchet MS', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1F7A80" font-weight="bold" font-style="normal" text-anchor="start"><tspan x="170" dy="0.0">M7  Évaluation</tspan></text><text x="170" y="1096" font-family="'Trebuchet MS', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1F2A33" font-weight="normal" font-style="normal" text-anchor="start"><tspan x="170" dy="0.0">Tâche contextualisée : une famille doit choisir un savon.</tspan><tspan x="170" dy="24.6">Justifier le choix par une affirmation, une donnée et un</tspan><tspan x="170" dy="24.6">raisonnement chimique.</tspan></text></svg>