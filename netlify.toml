# Configuration de la mise en ligne sur Netlify

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Les fichiers de l'application changent de nom à chaque version :
# le navigateur peut les garder en mémoire longtemps.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"